 clip-path:polygon(50% 0%,60% 16%,56% 27%,70% 40%,66% 55%,78% 70%,60% 88%,50% 100%,40% 88%,22% 70%,34% 55%,30% 40%,44% 27%,40% 16%);
 background:radial-gradient(ellipse at 50% 88%,#fffbe2 0 8%,#ffe9a4 18%,#ffb43c 38%,#f2620c 66%,#8f0c04 92%)}

/* ---------- login card ---------- */
.hell-vignette{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 12%,#00000059 64%,#000000d9 100%)}

.hell-corner.br{right:4px;bottom:4px;transform:rotate(180deg)}

.entrance-message{position:absolute;inset:0;z-index:12;display:grid;place-content:center;text-align:center;pointer-events:none;opacity:0;color:#ffe8bc;text-shadow:0 3px 30px #000,0 0 40px #ff6a1e55;font:clamp(23px,5vw,48px)/1.25 Georgia,serif;letter-spacing:.12em;transition:opacity 1.1s}
.entrance-message small{display:block;margin-top:10px;font:10px/2.6 system-ui;letter-spacing:.5em;color:#ffc17c}
.hell-flash{position:absolute;inset:0;z-index:10;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,#ffc46c99,#ff5a1200 68%);opacity:0}
.hell-progress{position:absolute;bottom:34px;left:calc(50% - 110px);width:220px;height:2px;background:#7a4a1855;z-index:12;opacity:0;overflow:hidden;box-shadow:0 0 12px #ff8a2044}
.hell-progress i{display:block;width:38%;height:100%;background:linear-gradient(90deg,#ffb066,#ffe6b6);animation:infernal-load 1.7s ease-in-out infinite}
.access-entering .hell-login-content{opacity:0;transform:scale(.9) translateY(10px);pointer-events:none}
.access-entering .hell-door.left{transform:rotateY(-116deg);transition-delay:.85s}
.access-entering .hell-door.right{transform:rotateY(116deg);transition-delay:.85s}
.access-entering .hell-door{filter:brightness(.8)}
.access-entering .gate-seam{opacity:0;transition-delay:.6s}
.access-entering .hell-flash{animation:infernal-flash 2.8s ease-out}
.access-entering .entrance-message{opacity:1;transition-delay:3.2s}
.access-entering .hell-progress{opacity:1;transition:opacity .6s 3.3s}
.access-entering .hell-flyers,.access-entering .hell-fire{z-index:9}
.access-entering .hell-bat{animation-duration:5.5s}
.access-entering .hell-dragon{animation-duration:6.5s}
@keyframes infernal-flash{0%{opacity:0}6%{opacity:.9}22%{opacity:.25}100%{opacity:0}}
@keyframes infernal-load{from{transform:translateX(-110%)}to{transform:translateX(360%)}}
.access-reveal #infernal-login{opacity:0;transition:opacity .9s ease-in;pointer-events:none}
.access-reveal .entrance-message{opacity:0;transition:opacity .3s}

@media(max-width:620px){.hell-login-card{padding:28px 22px 20px;margin-top:150px}.hell-guardian{top:-212px;width:262px}.hell-guardian img.pg-guard{left:18px;width:172px;height:180px}.guardian-gun{left:126px;bottom:46px;width:70px;height:39px}.guardian-bubble{bottom:184px;width:210px;font-size:11px;padding:9px 11px}.hell-jamb{width:14px}.hell-dragon{width:170px}.hell-demon{width:78px;height:132px}.hell-demon.left{left:0}.hell-demon.right{right:0}.hell-demon.arch{display:none}.hell-moon{width:34vmin;height:34vmin;margin-left:-17vmin}.door-ring{width:30px;height:30px}.hell-fire{height:24vmin}.hell-login-card h1{font-size:27px}.hell-ridge.r1{height:26%}@media(max-width:620px){.hell-ground{height:44%}}}
@media(max-height:660px){.hell-login-content{display:flex;align-items:flex-start;justify-content:center;padding-top:96px}.hell-login-card{margin-top:118px}.hell-guardian{top:-192px;width:240px}.hell-guardian img.pg-guard{width:152px;height:160px;left:12px}.guardian-gun{left:114px;bottom:42px;width:66px}.guardian-bubble{bottom:166px}.hell-login-card h1{font-size:26px}.hell-login-subtitle{margin-bottom:16px}}
@media(prefers-reduced-motion:reduce){#infernal-login *,#infernal-login *:before,#infernal-login *:after{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}.hell-bat,.hell-dragon{display:none}.access-entering .hell-door.left{transform:rotateY(-116deg)}.access-entering .hell-door.right{transform:rotateY(116deg)}.access-entering .entrance-message{opacity:1}.hell-embers,.hell-veins{display:none}}

@keyframes lake-breathe{from{opacity:.82;transform:scaleY(1)}to{opacity:1;transform:scaleY(1.07)}}
@keyframes river-pulse{0%,100%{opacity:.62}50%{opacity:.95}}
